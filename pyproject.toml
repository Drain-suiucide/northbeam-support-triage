[project]
name = "northbeam-support-triage"
version = "0.1.0"
description = "Portfolio-grade multilingual support triage workflow with n8n and CRM-safe routing"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.10,<3",
]

[project.optional-dependencies]
dev = ["httpx>=0.28,<1", "pytest>=8.3,<9", "ruff>=0.9,<1", "mypy>=1.14,<2"]

[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]
[tool.pytest.ini_options]
pythonpath = ["."]
